name: Release extension

# Builds the extension and uploads it to the Chrome Web Store. The Release workflow (release.yml)
# calls it for each extension release; pushing a tag `extension-v<version>` (matching
# extension/package.json) by hand does the same. Either submits it for review and attaches the zip
# to the GitHub release; running it by hand can stage it instead, or only upload the draft. Once
# the store publishes the version, promote-release.yml turns its pre-release into a full one. Auth is keyless: GitHub's OIDC token is exchanged through Workload Identity
# Federation for a short-lived access token of the service account added to the publisher.

on:
  push:
    tags: ['extension-v*']
  workflow_call:
    inputs:
      ref:
        description: The release tag to build
        type: string
        required: true
      publish:
        type: string
        default: submit for review, publish on approval
  workflow_dispatch:
    inputs:
      publish:
        description: 'After uploading'
        type: choice
        options:
          - submit for review, publish on approval
          - submit for review, stage on approval
          - upload only
        default: submit for review, publish on approval

permissions:
  contents: read

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: version
        name: Check the version
        env:
          TAG: ${{ inputs.ref || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          version=$(node -p "require('./extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ -n "$TAG" && "$TAG" != "extension-v$version" ]]; then
            echo "::error::Tag $TAG doesn't match extension/package.json ($version)"
            exit 1
          fi

      - run: npm ci
      - run: npm run build -w @oktamax/extension

      - name: Zip
        run: cd extension/dist && zip -qr "$GITHUB_WORKSPACE/oktamax-${{ steps.version.outputs.version }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: oktamax-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  # The zip goes on the GitHub release too, for installs outside the store.
  attach:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" oktamax-*.zip --clobber -R "$GITHUB_REPOSITORY"
          else
            echo "No GitHub release for $TAG: nothing to attach to."
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Holds the variables below, and any required reviewers before a release goes out.
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/${{ vars.CWS_EXTENSION_ID }}
    permissions:
      contents: read
      id-token: write
    env:
      ITEM: https://chromewebstore.googleapis.com/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
      UPLOAD: https://chromewebstore.googleapis.com/upload/v2/publishers/${{ vars.CWS_PUBLISHER_ID }}/items/${{ vars.CWS_EXTENSION_ID }}
      ZIP: oktamax-${{ needs.build.outputs.version }}.zip
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false

      - name: Upload
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" "$@"; }

          response=$(api -X POST -T "$ZIP" "$UPLOAD:upload")
          echo "$response"
          state=$(jq -r .uploadState <<<"$response")

          # Large packages are processed asynchronously.
          for _ in $(seq 60); do
            [[ "$state" == IN_PROGRESS || "$state" == UPLOAD_IN_PROGRESS ]] || break
            sleep 10
            response=$(api "$ITEM:fetchStatus")
            state=$(jq -r .lastAsyncUploadState <<<"$response")
          done

          if [[ "$state" != SUCCEEDED ]]; then
            echo "::error::Upload ended in state $state"
            echo "$response"
            exit 1
          fi

      - name: Submit for review
        if: inputs.publish != 'upload only'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISH_TYPE: ${{ inputs.publish == 'submit for review, stage on approval' && 'STAGED_PUBLISH' || 'DEFAULT_PUBLISH' }}
        run: |
          response=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"publishType\": \"$PUBLISH_TYPE\"}" "$ITEM:publish")
          echo "$response"
          jq -r '.warningInfo.warnings[]? | "::warning::\(.reason): \(.description)"' <<<"$response"
          echo "Submitted ${{ needs.build.outputs.version }}: $(jq -r .state <<<"$response")" >> "$GITHUB_STEP_SUMMARY"
