name: Release

# Releases the extension or the chat server, each with its own version (see shared/src/version.ts
# for how they stay compatible). Bumps the version in its package.json, merges that into main through
# a pull request, tags the merge `<component>-v<version>`, and creates a GitHub pre-release whose
# notes list the pull requests since its last release. The extension then goes to the Chrome Web Store; the release
# becomes a full release once the store publishes it (promote-release.yml). A server release is
# promoted by hand when it's deployed.

on:
  workflow_dispatch:
    inputs:
      component:
        description: What to release
        type: choice
        options: [extension, server]
      bump:
        description: 'Version bump (auto: major for breaking changes, minor for feat/ branches, else patch)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not $GITHUB_REF_NAME"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, for the version and the notes

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: next
        name: Work out the version and notes
        env:
          COMPONENT: ${{ inputs.component }}
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/release.mjs "$COMPONENT" "$BUMP" --write --notes "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_OUTPUT"
          { echo "## $(grep '^title=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      # main only takes changes through pull requests, so the version bump goes through one that
      # the workflow opens and merges itself. Its title starts with "Release", which release.mjs
      # leaves out of later notes.
      - name: Merge the version bump and tag it
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ steps.next.outputs.version }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The first release keeps the version already in package.json: nothing to merge.
          if ! git diff --quiet; then
            branch="release/$TAG"
            git switch -c "$branch"
            git commit -am "Release $COMPONENT $VERSION"
            git push origin "$branch"
            pr=$(gh pr create --base main --head "$branch" --title "Release $COMPONENT $VERSION" \
              --body "Sets the $COMPONENT version to $VERSION for \`$TAG\`. Opened and merged by the Release workflow.")
            gh pr merge "$pr" --merge --delete-branch
            sha=$(gh pr view "$pr" --json mergeCommit --jq .mergeCommit.oid)
            git fetch origin "$sha"
            git checkout --detach "$sha"
          fi
          git tag -a "$TAG" -m "Release $COMPONENT $VERSION"
          git push origin "$TAG"

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ steps.next.outputs.tag }}
          TITLE: ${{ steps.next.outputs.title }}
        run: |
          # Releases are immutable once published, so an extension release starts as a draft:
          # release-extension.yml attaches the zip and then publishes it.
          draft=$([[ "$COMPONENT" == extension ]] && echo --draft || true)
          gh release create "$TAG" --verify-tag --prerelease $draft --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # Tags pushed with the workflow's token don't start other workflows, so call the store release.
  extension:
    needs: release
    if: inputs.component == 'extension'
    uses: ./.github/workflows/release-extension.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
